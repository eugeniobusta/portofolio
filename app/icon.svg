<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark background -->
  <rect width="100" height="100" rx="20" fill="#17181d"/>

  <!-- E letterform -->
  <!-- Spine -->
  <rect x="21" y="20" width="7" height="60" rx="2" fill="#ece8e1"/>
  <!-- Top bar -->
  <rect x="21" y="20" width="33" height="7" rx="2" fill="#ece8e1"/>
  <!-- Middle bar (amber accent) -->
  <rect x="21" y="46" width="26" height="7" rx="2" fill="#c89030"/>
  <!-- Bottom bar -->
  <rect x="21" y="73" width="33" height="7" rx="2" fill="#ece8e1"/>

  <!-- B letterform -->
  <!-- Top bowl: semicircle from y=20 to y=50 (radius 15, bulges right to x=79) -->
  <path d="M 64 20 A 15 15 0 0 1 64 50 Z" fill="#ece8e1"/>
  <!-- Bottom bowl: semicircle from y=50 to y=80 (same radius) -->
  <path d="M 64 50 A 15 15 0 0 1 64 80 Z" fill="#ece8e1"/>
  <!-- Spine (painted last to cover bowl left edges) -->
  <rect x="57" y="20" width="7" height="60" rx="2" fill="#ece8e1"/>
</svg>
